<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#443050"><title>짜요짜요 타이쿤 업데이트</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#443050;font-family:system-ui,sans-serif;color:#54394d}main{margin:24px;padding:32px;max-width:320px;text-align:center;background:#fff4d8;border-radius:22px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{display:inline-block;padding:12px 20px;border-radius:10px;background:#d68a47;color:white;text-decoration:none;font-weight:700}[hidden]{display:none!important}</style><main><h1>새로운 목장 준비 중</h1><p id="status">최신 버전을 가져오고 있어요.<br>기존 돈과 목장는 그대로 유지됩니다.</p><a href="./" id="fallback" hidden>게임으로 돌아가기</a></main><script>
(async()=>{try{if(!('serviceWorker' in navigator)){location.replace('./');return;}const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});if(!reg.installing)await reg.update();const worker=reg.installing||reg.waiting;if(worker&&worker.state!=='activated'){await new Promise((resolve,reject)=>{const limit=setTimeout(()=>reject(Error('timeout')),45000);const check=()=>{if(worker.state==='activated'){clearTimeout(limit);resolve();}else if(worker.state==='redundant'){clearTimeout(limit);reject(Error('install'));}};worker.addEventListener('statechange',check);check();});}await navigator.serviceWorker.ready;location.replace('./');}catch{document.getElementById('status').textContent='업데이트 연결을 확인해 주세요. 기존 저장은 유지됩니다. 잠시 후 다시 열거나 현재 게임으로 돌아갈 수 있어요.';document.getElementById('fallback').hidden=false;}})();
</script></html>

<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#52405d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="짜요짜요타이쿤3의 착유와 도구 조작을 새 일러스트로 즐기는 비공식 터치 재구성"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/classic/cow-0.png"><link rel="icon" href="./assets/classic/cow-0.png"><link rel="stylesheet" href="./classic.css"><title>쭉쭉짜유 타이쿤</title></head>
<body><main id="game"><header class="top"><div><span class="eyebrow">다시 만난, 그때 그 목장</span><h1>쭉쭉짜유<span>타이쿤</span></h1></div><button class="menu-button" data-action="settings" aria-label="게임 설정">☰</button></header><section class="hud" aria-label="목장 현황"><div><small id="season">1개월 · 작은 목장</small><strong id="coins">0 G</strong></div><div class="fruit"><img src="./assets/classic/prop-5.png" alt="사랑의 열매"><div><small>사랑의 열매</small><strong id="fruit">0</strong></div></div><button class="pause-button" id="pause" data-action="pause" aria-label="일시정지">Ⅱ</button></section><section class="storage-summary" aria-label="저장고와 신선도"><span id="storage-text"></span><span id="freshness-text"></span></section><div class="quick-sale"><button id="quick-sell" data-action="quickSell">우유 바로 판매 · 기본 40G/통</button><small>착유통 + 저장고 전량 판매 · 저장고 신선도 70% 미만은 32G/통</small></div><section class="pasture" aria-label="젖소 목장"><div class="ranch-sign"><span id="ranch-title">세 마리로 시작하는 작은 목장</span><small id="growth-text">Lv.1 · 천천히 적응하기</small></div><div class="herd" id="herd"></div><div class="farm-caption">우유 한 통에 담는, 작은 행복</div></section><section class="merchant" id="merchant" aria-label="원유 상인"></section><div class="hint" role="status" id="hint">착유 도구로 젖소를 눌러 보세요.</div><section class="workbench"><div class="tools" id="tools" aria-label="도구 선택"></div><div class="transfer-actions"><button class="transfer" data-action="transfer"><img src="./assets/classic/prop-4.png" alt=""><span><b id="transfer-title">저장고로 옮기기 <kbd>0</kbd></b><small id="carry-text"></small><i class="gauge"><i id="carry-fill"></i></i></span></button><button class="discard-button" data-action="discard">착유통<br>버리기</button></div></section><nav class="bottom-nav" aria-label="목장 관리"><button data-action="shop"><img src="./assets/classic/prop-10.png" alt=""><span>목장·장비</span></button><button data-action="factory"><img src="./assets/classic/prop-11.png" alt=""><span>유제품 공장</span></button><button data-action="pet"><img src="./assets/classic/cow-5.png" alt=""><span>애완소</span></button><button data-action="stocks"><img src="./assets/classic/prop-8.png" alt=""><span>상점가</span></button></nav><footer><span id="save-state">기기에 자동 저장</span><span>클래식 터치 · v3.2.4</span></footer></main><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="sheet"></div></dialog><script type="module" src="./classic-app.mjs"></script></body></html>
